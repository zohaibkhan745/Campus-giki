server {
    listen 80;
    server_name _;

    # Maximum upload size for event posters, banner graphics, and signed venue slips
    client_max_body_size 25M;

    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression for high-speed client delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 1. Frontend Single Page Application Routing (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy API requests to backend NestJS container
    location /api/ {
        proxy_pass http://server:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # 3. Direct Static Uploads (event banners, society logos, signed clearance slips)
    # PERFORMANCE (P03): Served directly by Nginx from shared volume, completely bypassing Node.js
    location /uploads/ {
        root /var/www;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # 4. Long-term caching for static compiled frontend bundles
    location ~* \.(?:js|css|woff2?|ttf|eot|ico|png|jpg|jpeg|gif|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
