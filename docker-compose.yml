services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: campus-giki-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_giki}
      POSTGRES_USER: ${POSTGRES_USER:-campus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_secure_password_here}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus_admin} -d ${POSTGRES_DB:-campus_giki}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - campus-network

  # ==========================================
  # 2. Redis In-Memory Cache Service
  # ==========================================
  redis:
    image: redis:7-alpine
    container_name: campus-giki-redis
    restart: unless-stopped
    command: >
      redis-server --maxmemory 256mb
                   --maxmemory-policy allkeys-lru
                   --save ""
                   --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - campus-network

  # ==========================================
  # 3. NestJS Backend API Service
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: campus-giki-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 5000
      API_PREFIX: ${API_PREFIX:-api/v1}
      CORS_ORIGIN: "*"
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-3000}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-campus_admin}:${POSTGRES_PASSWORD:-campus_secure_password_here}@postgres:5432/${POSTGRES_DB:-campus_giki}?schema=public&connection_limit=20&pool_timeout=10
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_production_encryption_key_change_me!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      STORAGE_DRIVER: local
      STORAGE_LOCAL_PATH: ./uploads
      UPLOAD_MAX_SIZE_MB: ${UPLOAD_MAX_SIZE_MB:-25}
      APP_URL: ${APP_URL:-http://localhost}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-"Campus GIKI Portal" <dsa-portal@giki.edu.pk>}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-AdminPassword@123}
      AUTO_SEED: ${AUTO_SEED:-false}
    volumes:
      - server_uploads:/app/uploads
    networks:
      - campus-network

  # ==========================================
  # 3. Frontend Web Service (React + Nginx)
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: campus-giki-client
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-80}:80"
    depends_on:
      - server
    volumes:
      - server_uploads:/var/www/uploads:ro
    networks:
      - campus-network

# ==========================================
# Persistent Volumes (Data Preserved)
# ==========================================
volumes:
  postgres_data:
    name: campus_giki_postgres_data
  server_uploads:
    name: campus_giki_server_uploads

# ==========================================
# Network
# ==========================================
networks:
  campus-network:
    name: campus_giki_network
    driver: bridge
